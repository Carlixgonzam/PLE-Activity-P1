<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rascal Snake</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 520px;
    margin: 40px auto;
    color: #222;
  }
  canvas {
    border: 1px solid #999;
    display: block;
    margin-top: 10px;
  }
  #gameOverMsg {
    color: #b00020;
    font-weight: bold;
  }
  #rascalNote, #lastUpdate {
    color: #555;
    font-size: 14px;
  }
  #lastUpdate {
    border-top: 1px solid #ddd;
    padding-top: 10px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>Rascal Snake</h1>

<p>Score: <span id="score">0</span> <span id="gameOverMsg"></span></p>

<canvas id="board" width="480" height="360"></canvas>

<p><button id="restart">New Game</button></p>

<p>Use arrow keys or WASD to steer.</p>

<p id="rascalNote">
  This page has no game logic. Every move is computed by a Rascal
  program running on this computer. This page only asks it for the
  next state and draws it.
</p>

<p id="lastUpdate">Last update: waiting for the game to start...</p>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const gameOverEl = document.getElementById("gameOverMsg");
const lastUpdateEl = document.getElementById("lastUpdate");
const restartBtn = document.getElementById("restart");

let tickHandle = null;

const keyToDir = {
  "ArrowUp": "up", "w": "up", "W": "up",
  "ArrowDown": "down", "s": "down", "S": "down",
  "ArrowLeft": "left", "a": "left", "A": "left",
  "ArrowRight": "right", "d": "right", "D": "right"
};

async function fetchJSON(path) {
  const res = await fetch(path);
  return res.json();
}

function describe(state) {
  const head = state.snake[0];
  if (state.gameOver) {
    return `Last update: Rascal reported a collision at (${head[0]}, ${head[1]}). Game over, score ${state.score}.`;
  }
  return `Last update: Rascal moved the head to (${head[0]}, ${head[1]}), heading ${state.direction}, score ${state.score}.`;
}

function draw(state) {
  const cell = Math.min(canvas.width / state.width, canvas.height / state.height);
  canvas.width = state.width * cell;
  canvas.height = state.height * cell;

  ctx.fillStyle = "#eeeeee";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#999999";
  for (const [x, y] of state.walls) {
    ctx.fillRect(x * cell, y * cell, cell, cell);
  }

  ctx.fillStyle = "#c0392b";
  ctx.fillRect(state.food[0] * cell + 2, state.food[1] * cell + 2, cell - 4, cell - 4);

  ctx.fillStyle = "#2e7d32";
  state.snake.forEach(([x, y]) => {
    ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
  });

  scoreEl.textContent = state.score;
  gameOverEl.textContent = state.gameOver ? "Game over" : "";
  lastUpdateEl.textContent = describe(state);

  if (state.gameOver && tickHandle) {
    clearInterval(tickHandle);
    tickHandle = null;
  }
}

async function tick() {
  draw(await fetchJSON("/tick"));
}

function startLoop(speed) {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(tick, speed);
}

async function newGame() {
  const state = await fetchJSON("/reset");
  draw(state);
  startLoop(state.speed);
}

window.addEventListener("keydown", async (e) => {
  const dir = keyToDir[e.key];
  if (!dir) return;
  e.preventDefault();
  draw(await fetchJSON("/move?dir=" + dir));
});

restartBtn.addEventListener("click", newGame);

fetchJSON("/state").then((state) => {
  draw(state);
  startLoop(state.speed);
});
</script>

</body>
</html>
